<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navette — Notre mariage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scroll-line" id="scroll-line"></div>

<header>
  <div class="nav">
    <div class="brand">Notre mariage</div>
    <nav class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="navette.html" class="active">Navette</a>
      <a href="cadeaux.html">Cadeaux</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="hero-inner">
    <p class="eyebrow">Organisez votre trajet</p>
    <h1>La navette</h1>
    <p class="hero-subtitle">Réservez votre place dans la navette pour rejoindre le château. Les places sont limitées !</p>
  </div>
</section>

<section class="trajets-section">
  <div class="wrap">
    <div id="trajets-list" class="trajets-grid">
      <p class="loading">Chargement des trajets…</p>
    </div>
  </div>
</section>

<!-- Modal réservation -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <h2>Réserver une place</h2>
    <p id="modal-trajet-info" class="modal-info"></p>
    <form id="reservation-form">
      <label>Votre nom complet
        <input type="text" id="input-name" placeholder="Ex : Marie Dupont" required maxlength="40">
      </label>
      <label>Nombre de places
        <input type="number" id="input-guests" min="1" max="8" value="1" required>
      </label>
      <button type="submit" class="btn-primary">Confirmer la réservation</button>
    </form>
    <p id="modal-success" class="success-msg" style="display:none">✅ Réservation confirmée !</p>
    <p id="modal-error" class="error-msg" style="display:none">❌ Une erreur est survenue.</p>
  </div>
</div>

<footer>
  <div class="wrap">
    <h3>Notre mariage</h3>
    <p class="foot-bottom">Fait avec amour ♥</p>
  </div>
</footer>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, getDocs, doc, updateDoc, arrayUnion, increment, query, orderBy, runTransaction, getDoc }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey:            "AIzaSyDpDr29d3kz5_4PYTe7xnAFWOtjaWCaTCY",
    authDomain:        "lesbebouslocos.firebaseapp.com",
    projectId:         "lesbebouslocos",
    storageBucket:     "lesbebouslocos.firebasestorage.app",
    messagingSenderId: "498635002834",
    appId:             "1:498635002834:web:786eb34d0b78a7ab442e0b"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  let selectedTrajetId   = null;
  let selectedTrajetData = null;

  // Charger les trajets
  async function loadTrajets() {
    const list = document.getElementById('trajets-list');
    try {
      const q = query(collection(db, 'navette_trajets'), orderBy('order'));
      const snap = await getDocs(q);
      list.innerHTML = '';

      if (snap.empty) {
        list.innerHTML = '<p class="error-msg">Aucun trajet trouvé.</p>';
        return;
      }

      snap.forEach(docSnap => {
        const t = docSnap.data();
        const placesRestantes = t.placesRestantes ?? 8;
        const complet = placesRestantes <= 0;

        const card = document.createElement('div');
        card.className = 'trajet-card' + (complet ? ' complet' : '');
        card.innerHTML = `
          <div class="trajet-heure">${t.heure}</div>
          <div class="trajet-route">${t.depart} → ${t.arrivee}</div>
          <div class="trajet-notes">${t.notes}</div>
          <div class="trajet-places ${complet ? 'complet' : ''}">
            ${complet ? '🚫 Complet' : `🪑 ${placesRestantes} place${placesRestantes > 1 ? 's' : ''} restante${placesRestantes > 1 ? 's' : ''}`}
          </div>
          ${!complet ? `<button class="btn-primary trajet-btn" data-id="${docSnap.id}" data-info="${t.heure} — ${t.depart} → ${t.arrivee}" data-places="${placesRestantes}">
            Réserver
          </button>` : ''}
        `;
        list.appendChild(card);
      });

      // Boutons réserver
      document.querySelectorAll('.trajet-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedTrajetId = btn.dataset.id;
          const placesRestantes = parseInt(btn.dataset.places);
          document.getElementById('modal-trajet-info').textContent = btn.dataset.info;
          document.getElementById('input-guests').max = placesRestantes;
          document.getElementById('input-guests').value = 1;
          document.getElementById('modal').style.display = 'flex';
          document.getElementById('modal-success').style.display = 'none';
          document.getElementById('modal-error').style.display = 'none';
          document.getElementById('reservation-form').style.display = 'block';
        });
      });

    } catch(e) {
      console.error('Erreur Firestore :', e);
      list.innerHTML = '<p class="error-msg">Erreur : ' + e.message + '</p>';
    }
  }

  // Fermer modal
  document.getElementById('modal-close').addEventListener('click', () => {
    document.getElementById('modal').style.display = 'none';
  });

  // Soumettre réservation
  document.getElementById('reservation-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name   = document.getElementById('input-name').value.trim();
    const guests = parseInt(document.getElementById('input-guests').value);
    const trajetRef = doc(db, 'navette_trajets', selectedTrajetId);

    try {
      await runTransaction(db, async (transaction) => {
        const trajetDoc = await transaction.get(trajetRef);
        if (!trajetDoc.exists()) throw new Error('Trajet introuvable.');

        const placesRestantes = trajetDoc.data().placesRestantes ?? 8;
        if (guests > placesRestantes) throw new Error('Plus assez de places disponibles.');

        const nouvelleReservation = {
          name:   name,
          guests: guests,
          date:   new Date().toISOString()
        };

        transaction.update(trajetRef, {
          placesRestantes: placesRestantes - guests,
          reservations:    arrayUnion(nouvelleReservation)
        });
      });

      document.getElementById('modal-success').style.display = 'block';
      document.getElementById('reservation-form').style.display = 'none';
      document.getElementById('modal-error').style.display = 'none';

      // Recharger les trajets pour mettre à jour les places
      loadTrajets();

    } catch(e) {
      console.error('Erreur réservation :', e);
      document.getElementById('modal-error').textContent = '❌ ' + e.message;
      document.getElementById('modal-error').style.display = 'block';
    }
  });

  // Scroll line
  window.addEventListener('scroll', () => {
    const el  = document.getElementById('scroll-line');
    const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
    el.style.width = pct + '%';
  });

  loadTrajets();
</script>
</body>
</html>
